name: Master workflow

on:
  pull_request:
    branches:
      - master-test

jobs:
  master-get-jfrog-version:
    uses: ./.github/workflows/master-get-jfrog-version.yml
    secrets: inherit

  bump-dev-number:
    uses: ./.github/workflows/master-bump-version.yml
    needs: [
      get-jfrog-stage-version,
    ]
    secrets: inherit

  publish-to-npm:
    name: Publish to npm
    needs: [
      get-jfrog-stage-version,
      bump-dev-number,
    ]
    uses: ./.github/workflows/master-upload-jfrog-build-to-npm.yml
    with:
      old_version: ${{ needs.get-jfrog-stage-version.outputs.stage_version }}
      new_version: ${{ needs.bump-dev-number.outputs.new_master_version }}
    secrets: inherit

  verify-npm-install:
    name: verify npm ci works correctly
    needs: [
      get-jfrog-stage-version,
      bump-dev-number,
      publish-to-npm
    ]
    uses: ./.github/workflows/master-verify-npm-install.yml
    secrets: inherit

  reupload-master-to-jfrog:
    name: Upload artifacts to JFrog
    needs: [
      get-jfrog-stage-version,
      bump-dev-number,
      publish-to-npm,
      verify-npm-install
    ]
    uses: ./.github/workflows/reupload-to-jfrog.yml
    with:
      old_version: ${{ needs.get-jfrog-stage-version.outputs.stage_version }}
      new_version: ${{ needs.bump-dev-number.outputs.new_master_version }}
      pipeline-stage: 'master'
    secrets: inherit

  reupload-master-to-jfrog-npm-repo:
    name: Upload artifacts to JFrog
    needs: [
      get-jfrog-stage-version,
      bump-dev-number,
      publish-to-npm,
      verify-npm-install,
      reupload-master-to-jfrog
    ]
    uses: ./.github/workflows/upload-to-jfrog-npm-repo.yml
    with:
      new_version: ${{ needs.bump-dev-number.outputs.new_master_version }}
      pipeline-stage: 'master'
    secrets: inherit

