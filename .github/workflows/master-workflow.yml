name: Master workflow
permissions:
  id-token: write
  contents: write

on:
  workflow_dispatch:

# Production npm publish is not done from this repo. Release path:
# 1. Promote the aerospike-nodejs-client release bundle to PROD in JFrog
# 2. artifact-publisher publishes to registry.npmjs.org (JFrog webhook)
# 3. Fast-forward master to stage manually after release
#
# master-upload-jfrog-build-to-npm.yml is legacy and unused.

jobs:
  get-release-version:
    uses: ./.github/workflows/master-bump-version.yml
