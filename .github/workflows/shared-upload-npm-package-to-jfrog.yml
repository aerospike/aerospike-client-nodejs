name: Upload to JFrog npm repository

permissions:
  # This is required for requesting the OIDC token
  id-token: write

on:
  workflow_call:
    inputs:
      new_version:
        type: string
        required: true
      pipeline-stage:
        type: string
        required: false
      jfrog-repo-name:
        type: string
        required: false
        default: ${{ vars.JFROG_REPO_NAME }}
      #oidc-provider:
      #  type: string
      #  description: ""
      #  required: false
      #  default: gh-aerospike-clients
      #oidc-audience:
      #  type: string
      #  description: ""
      #  required: false
      #  default: aerospike/clients
    secrets:
      plane_grass:
        required: true
      aisle_thank:
        required: true
      room_lane:
        required: true

jobs:
  upload-to-jfrog:
    name: Upload artifacts to JFrog
    env:
      JFROG_RELEASE_BUNDLE_NAME: aerospike-nodejs-client
    runs-on: ubuntu-22.04
    steps:

    - name: Checkout repository
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - name: Set up JFrog credentials
      uses: jfrog/setup-jfrog-cli@88e9eba31c07e31beefa4cef5c0e93d1af9535d7 # v4.6.1
      env:
        JF_URL: https://aerospike.jfrog.io
      with:
        oidc-provider-name: gh-aerospike-clients
        oidc-audience: aerospike/clients

    - name: Download Artifacts from Jfrog
      if: ${{ inputs.pipeline-stage == 'dev' }}
      run: jf rt dl "clients-npm-dev-local/aerospike/${{ env.NEW_VERSION }}/" "downloaded-artifacts/"
      env:
        NEW_VERSION: ${{ inputs.new_version }}
        PACKAGE_MANAGER: npm

    - name: Download Artifacts from Jfrog
      if: ${{ inputs.pipeline-stage == 'stage' }}
      run: jf rt dl "clients-npm-stage-local/aerospike/${{ env.NEW_VERSION }}/" "downloaded-artifacts/"
      env:
        NEW_VERSION: ${{ inputs.new_version }}
        PACKAGE_MANAGER: npm

    - name: Download Artifacts from Jfrog
      if: ${{ inputs.pipeline-stage == 'master' }}
      run: jf rt dl "clients-npm-prod-public-local/aerospike/${{ env.NEW_VERSION }}/" "downloaded-artifacts/"
      env:
        NEW_VERSION: ${{ inputs.new_version }}
        PACKAGE_MANAGER: npm

    - name: Move artifacts
      run: |
        tar --strip-components=1 -xvf aerospike-${{ env.NEW_VERSION }}.tgz
      env:
        NEW_VERSION: ${{ inputs.new_version }}
      working-directory: downloaded-artifacts/aerospike/${{ inputs.new_version }}

    - name: Update version in package.json
      run: 
        jq --arg v "${{ env.VERSION }}" '.version = $v' package.json > tmp.json && mv tmp.json package.json;
      env:
        VERSION: ${{ inputs.new_version }} 

    - name: Install dependencies and test install
      run:
        npm ci --ignore-scripts;

    - name: prepare to publish dev npm package to Jfrog
      if: ${{ inputs.pipeline-stage == 'dev' }}
      run: |
        echo "$plane_grass" | base64 --decode > ~/.npmrc  
      env:
        plane_grass: ${{ secrets.plane_grass }}

    - name: prepare to publish stage npm package to Jfrog
      if: ${{ inputs.pipeline-stage == 'stage' }}
      run: |
        echo "$aisle_thank" | base64 --decode > ~/.npmrc  
      env:
        aisle_thank: ${{ secrets.aisle_thank }}

    - name: prepare to publish master npm package to Jfrog
      if: ${{ inputs.pipeline-stage == 'master' }}
      run: |
        echo "$room_lane" | base64 --decode > ~/.npmrc  
      env:
        room_lane: ${{ secrets.room_lane }}

    - name: publish npm package to Jfrog dev repository
      if: ${{ inputs.pipeline-stage == 'dev' }}
      run: |
        npm login --registry=${{ env.JF_URL }}/artifactory/api/npm/clients-npm-dev-local/
        npm publish --registry ${{ env.JF_URL }}/artifactory/api/npm/clients-npm-dev-local/
      working-directory: downloaded-artifacts/aerospike/${{ inputs.new_version }}
      env:
        JF_URL: https://aerospike.jfrog.io

    - name: publish npm package to Jfrog stage repository
      if: ${{ inputs.pipeline-stage == 'stage' }}
      run: |
        npm login --registry=${{ env.JF_URL }}/artifactory/api/npm/clients-npm-stage-local/
        npm publish --registry ${{ env.JF_URL }}/artifactory/api/npm/clients-npm-stage-local/
      working-directory: downloaded-artifacts/aerospike/${{ inputs.new_version }}
      env:
        JF_URL: https://aerospike.jfrog.io

    - name: publish npm package to Jfrog prod repository
      if: ${{ inputs.pipeline-stage == 'master' }}
      run: |
        npm login --registry=${{ env.JF_URL }}/artifactory/api/npm/clients-npm-prod-public-local/
        npm publish --registry ${{ env.JF_URL }}/artifactory/api/npm/clients-npm-prod-public-local/
      working-directory: downloaded-artifacts/aerospike/${{ inputs.new_version }}
      env:
        JF_URL: https://aerospike.jfrog.io