name: 'Build node cpp bindings'
run-name: 'Build node cpp bindings (nodejs-tags=${{ inputs.nodejs-tags }}, platform-tag=${{ inputs.platform-tag }}, run_tests=${{ inputs.run_tests }}, publish-build-info=${{ inputs.publish-build-info }})'

permissions:
  id-token: write
  contents: read
  statuses: write

on:
  workflow_dispatch:
    inputs:
      nodejs-tags:
        type: string
        required: false
        default: '[["v115", "20"], ["v127", "22"], ["v137", "24"], ["v141", "25"]]'
      platform-tag:
        type: string
        required: true
      run_tests:
        type: boolean
        required: false
        default: false
      publish-build-info:
        type: boolean
        required: false
        default: false
      jf-build-id:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: false
      use-server-rc:
        required: false
        type: boolean
        default: false
      server-tag:
        required: false
        type: string
        default: 'latest'
      test-file:
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      is_workflow_call:
        type: boolean
        default: true
        required: false
      nodejs-tags:
        type: string
        required: false
        default: '[["v115", "20"], ["v127", "22"], ["v137", "24"], ["v141", "25"]]'
      version:
        type: string
        required: true
      platform-tag:
        type: string
        required: true
      run_tests:
        type: boolean
        required: false
        default: false
      publish-build-info:
        type: boolean
        required: false
        default: false
      jf-build-id:
        type: string
        required: false
        default: ''
      use-server-rc:
        required: false
        type: boolean
        default: false
      server-tag:
        required: false
        type: string
        default: 'latest'
      test-file:
        required: false
        type: string
        default: ''
    secrets:
      soup_hat:
        required: true
      cell_girl:
        required: true
      song_loss:
        required: true

jobs:
  get-runner-os:
    outputs:
      runner-os: ${{ steps.get-runner-os.outputs.runner_os }}
      nodejs-matrix: ${{ steps.filter-nodejs-matrix.outputs.nodejs-matrix }}
    runs-on: ubuntu-22.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
      with:
        egress-policy: audit

    - id: get-runner-os
      run: |
        # CI platform-tag naming (Node.js / prebuild conventions, not Python manylinux):
        #   linux_{arch}   — GitHub-hosted Linux runners (glibc = runner image, not manylinux container)
        #   darwin_{arch}  — matches process.platform "darwin"; _2 = macOS 15 runner (Node 25)
        #   win32_x64      — matches process.platform "win32" + x64 (prebuilds/ win32-x64/)
        declare -A map
        map[linux_x86_64]="ubuntu-22.04"
        map[linux_aarch64]="ubuntu-22.04-arm"
        map[win32_x64]="windows-2022"
        map[darwin_x86_64]="macos-14-large"
        map[darwin_x86_64_2]="macos-15-large"
        map[darwin_arm64]="macos-14"
        map[darwin_arm64_2]="macos-15"
        echo runner_os=${map[${{ inputs.platform-tag }}]} >> $GITHUB_OUTPUT
      shell: bash

    # Node 25 builds on macOS 15 runners only; Node 20–24 on macOS 14. Reusable workflow
    # jobs cannot use matrix in job-level if, so filter the matrix here (Python client pattern).
    - id: filter-nodejs-matrix
      env:
        NODEJS_TAGS: ${{ inputs.nodejs-tags }}
        PLATFORM_TAG: ${{ inputs.platform-tag }}
      run: |
        filtered=$(echo "$NODEJS_TAGS" | jq -c --arg p "$PLATFORM_TAG" '
          [.[] | select(
            if .[1] == "25" then
              ($p != "darwin_x86_64" and $p != "darwin_arm64")
            else
              ($p != "darwin_x86_64_2" and $p != "darwin_arm64_2")
            end
          )]
        ')
        echo "nodejs-matrix=${filtered}" >> "$GITHUB_OUTPUT"
      shell: bash

  build-prebuild:
    needs: get-runner-os
    if: ${{ needs.get-runner-os.outputs.nodejs-matrix != '[]' }}
    strategy:
      matrix:
        nodejs-tag: ${{ fromJSON(needs.get-runner-os.outputs.nodejs-matrix) }}
      fail-fast: false
    uses: aerospike/shared-workflows/.github/workflows/reusable_execute-build.yaml@1004088a1b5122b9b71a39b40f619f6b50e78d16
    with:
      runs-on: ${{ needs.get-runner-os.outputs.runner-os }}
      gh-source-ref: ${{ inputs.version }}
      jf-project: database
      jf-build-name: nodejs-client
      # Unique JFrog build-info per prebuild artifact (CICD-standard: {prefix}-buildinfo-{suffix}).
      # Prefix is jf-build-id from dev-workflow (e.g. {run_id}-{run_attempt}); suffix is abi + platform.
      jf-build-id: ${{ inputs.jf-build-id }}-buildinfo-${{ matrix.nodejs-tag[0] }}-${{ inputs.platform-tag }}
      jf-url: https://aerospike.jfrog.io
      gh-artifact-name: ${{ matrix.nodejs-tag[0] }}-${{ inputs.platform-tag }}.build
      gh-artifact-directory: prebuilds
      gh-workflows-ref: 1004088a1b5122b9b71a39b40f619f6b50e78d16
      oidc-provider-name: database-gh-aerospike
      oidc-audience: database-gh-aerospike
      publish-build-info: ${{ inputs.publish-build-info }}
      build-script-path: ./scripts/ci/build-node-prebuild.sh
      working-directory: local
      build-env: PLATFORM_TAG=${{ inputs.platform-tag }};NODE_VERSION=${{ matrix.nodejs-tag[1] }};MACOS_OPENSSL_VERSION=3
    permissions:
      id-token: write
      contents: read
