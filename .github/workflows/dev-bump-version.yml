  # Takes in how to bump version as input
  # Commits changes to bump version and outputs the new version and commit hash as output
  name: Bump version

  permissions:
    # This is required for requesting the OIDC token
    id-token: write
    contents: read

  on:
    workflow_call:
      secrets:
        desk_mood:
          required: true
      outputs:
        dev_version:
          value: ${{ jobs.get-new-version.outputs.dev_version }}

  jobs:

    get-new-version:
      name: Get new version string
      runs-on: ubuntu-22.04
      outputs:
        current_version: ${{ steps.get-current-version.outputs.current_version }}
      steps:

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: ${{ secrets.desk_mood }}

      - name: Set up JFrog credentials
        uses: jfrog/setup-jfrog-cli@88e9eba31c07e31beefa4cef5c0e93d1af9535d7 # v4.6.1
        env:
          JF_URL: https://aerospike.jfrog.io
        with:
          oidc-provider-name: gh-aerospike-clients
          oidc-audience: aerospike/clients

      - name: Get version from JFROG repository
        id: get-jfrog-version
        run: |
          echo "jfrog_version=$(jfrog rt s "clients-npm-dev-local/aerospike/*" | jq -r '.[]?.path | capture("aerospike/(?<version>[^/]+)") | .version' | grep -v '^-$' | grep -v '^lib$' | sort -V | grep -v 'rc' | tail -n1)" >> $GITHUB_OUTPUT

      - name: Get version from github repository
        id: get-github-version
        run: |
          echo "github_version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Print versions
        run: |
          echo "jfrog version is ${{ steps.get-jfrog-version.outputs.jfrog_version }}"
          echo "github version is ${{ steps.get-github-version.outputs.github_version }}"

      - name: Install library that parses nodejs versions
        run: npm install semver@7.7.2 --ignore-scripts
        working-directory: .github/workflows

      - name: Get new version
        id: get-new-version
        run: |
          set -e;
          dev_version=$(node dev-bump-version.js ${{ needs.get-current-version.outputs.current_version }} ${{ needs.get-jfrog-version.outputs.jfrog_version }});
          echo "dev_version=$dev_version" >> $GITHUB_OUTPUT;
        working-directory: .github/workflows

      - name: Print new version
        run: |
          echo "${{ steps.get-new-version.outputs.dev_version }}"