  # Takes in how to bump version as input
  # Commits changes to bump version and outputs the new version and commit hash as output
  name: Bump version

  permissions:
    # This is required for requesting the OIDC token
    id-token: write
    # We need to publish a tag
    contents: write

  on:
    workflow_call:
      outputs:
        dev_version:
          value: ${{ jobs.get-new-version.outputs.dev_version }}

  jobs:

    get-new-version:
      name: Get new version string
      runs-on: ubuntu-22.04
      outputs:
        dev_version: ${{ steps.get-new-version.outputs.dev_version }}
      steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JFrog credentials
        uses: step-security/setup-jfrog-cli@a6b41f8338bea0983ddff6bd4ede7d2dcd81e1fa # v4.8.1
        env:
          JF_URL: https://aerospike.jfrog.io
        with:
          oidc-provider-name: gh-aerospike-clients
          oidc-audience: aerospike/clients

      - name: Install library that parses nodejs versions
        run: npm install semver@7.7.2 --ignore-scripts
        working-directory: .github/workflows

      - name: Tag new version
        id: get-new-version
        # Can't use "npm version" to bump the dev number. It changes the version in package.json
        # which should only have the current release or expected future release version.
        run: |
          set -e;
          last_tag=$(git describe --tags --abbrev=0)
          echo "Last version tag is $last_tag"

          new_tag=$(node dev-bump-version.js "$last_tag");
          git tag $new_tag
          git push origin tag $new_tag
          echo "dev_version=$new_tag" >> $GITHUB_OUTPUT;

          # Update package.json if last tag was a release tag
          current_release_version=$(npm pkg get version)
          next_release_version=$(node strip_prerelease_part.js $new_tag)
          if [[ "$current_release_version" != "$next_release_version" ]]; then
            git status
            npm version patch --no-git-tag-version
            git push
          fi
        working-directory: .github/workflows
