name: Dev workflow

on:
  workflow_dispatch:
    inputs:
      bump-type:
        type: choice
        options:
          - major
          - minor
          - patch
        description: From last release version
        required: true

jobs:
  bump-dev-number-and-tag:
    uses: ./.github/workflows/dev-bump-version.yml
    with:
      bump-type: ${{ inputs.bump-type }}

  build-node-cpp-addons:
    uses: ./.github/workflows/dev-build-node-cpp-addons.yml
    needs: [bump-dev-number-and-tag]
    with:
      version: ${{ needs.bump-dev-number-and-tag.outputs.dev_version }}
      # Run-level JFrog build-info prefix (not the final per-artifact ID). Each matrix
      # cell in dev-build-node-cpp-bindings.yml appends -buildinfo-{abi}-{platform}.
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}
      publish-build-info: true
      run_tests: false
    secrets:
      soup_hat: ${{ secrets.soup_hat }}
      cell_girl: ${{ secrets.cell_girl }}
      song_loss: ${{ secrets.song_loss }}

  reupload-and-promote-to-dev:
    needs: [bump-dev-number-and-tag, build-node-cpp-addons]
    uses: ./.github/workflows/reupload-gh-artifacts-as-jfrog-release-bundle.yml
    with:
      # Parent deploy build-info ID; child compile jobs use {id}-buildinfo-{abi}-{platform}.
      # jf-metadata-build-id in reupload links children via {id}-buildinfo.
      jfrog_build_id: ${{ github.run_id }}-${{ github.run_attempt }}
      next_release_version: ${{ needs.bump-dev-number-and-tag.outputs.dev_version }}
      latest_tag: ${{ needs.bump-dev-number-and-tag.outputs.dev_version }}
      dry-run: false
    permissions:
      contents: read
      actions: read
      id-token: write
