# As of this writing, there are no Github Actions in the marketplace
# that allow fast forwarding using a personal access token
# So we need to use this for now
name: 'Fast forward merge'
on:
  workflow_dispatch:
    inputs:
      ref_to_merge:
        type: string
        required: true
      base_branch:
        type: string
        required: true
  workflow_call:
    inputs:
      # If another branch, it must be origin/<branch>
      ref_to_merge:
        type: string
        required: true
      base_branch:
        type: string
        required: true
    secrets:
      desk_mood:
        required: true

jobs:
  merge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          # Fetch the whole history to prevent unrelated history errors
          fetch-depth: '0'
          token: ${{ secrets.desk_mood }}

      - name: Fast forward
        run: git merge --ff-only ${{ inputs.ref_to_merge }}

      - name: Upload changes to remote head branch
        run: git push
