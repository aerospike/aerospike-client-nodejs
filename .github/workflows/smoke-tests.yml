run-name: Smoke tests (server-tag=${{ inputs.server-tag }})

permissions:
  contents: read
  id-token: write
  checks: write
  pull-requests: write

on:
  pull_request:
  workflow_dispatch:
    inputs:
      server-tag:
        type: string
        required: true

jobs:
  check-type-definitions:
    runs-on: ubuntu-22.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: recursive

    - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: 20

    - name: Perform type checking on the type definitions
      run: |
        npm ci --ignore-scripts
        npx tsc;

  smoke-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [
          20,
          22,
          24,
          25
        ]
      fail-fast: false
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: recursive

    - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build client
      run: |
        # Install dependencies
        npm ci --ignore-scripts
        # Build C client dependency (TODO: this should belong in the build script)
        ./scripts/build-c-client.sh
        # Then build client itself
        npm run build

    - uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@bd168dedaa4fc0b17a560541779d815540eded2d # v3.7.0
      id: setup-as-server
      with:
        num-nodes: 1
        oidc-provider: ${{ vars.OIDC_PROVIDER_NAME }}
        oidc-audience: ${{ vars.OIDC_AUDIENCE }}
        server-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.server-tag || '8.1.2.3' }}
        env-vars: DEFAULT_TTL=2592000;

    - name: Run tests
      run: npm run test

    - name: Run documentation examples
      if: matrix.node-version == 20
      run: |
        mkdir -p example-results
        npm run examples:all -- --report-junit example-results/results.xml

    - name: Publish example run results
      if: ${{ !cancelled() && matrix.node-version == 20 }}
      uses: step-security/publish-unit-test-result-action@681100d67b09305624c089873f12c545ee7cbc24 # v2.23.0
      with:
        files: example-results/**/*.xml
        check_name: Example Run (${{ github.event_name == 'workflow_dispatch' && inputs.server-tag || '8.1.2.3' }})

    - if: ${{ !cancelled() }}
      run: |
        docker logs ${{ steps.setup-as-server.outputs.container-names }}
        cat test.log
