name: Stage workflow

on:
  workflow_dispatch:
    inputs:
      server-tag:
        description: 'Aerospike Docker image tag for EE and CE tests. Default is the newest public GA (8.1.2.5). For 8.2 RC, set this (e.g. 8.2.0.0-rc4) and enable use-server-rc.'
        required: false
        type: string
        default: '8.1.2.5'
      use-server-rc:
        description: 'Pull from Docker Hub *-rc repos (aerospike-server-rc / aerospike-server-enterprise-rc). Leave off unless server-tag is an RC.'
        required: false
        type: boolean
        default: false
      run_tests:
        description: 'Run comprehensive tests against the selected server tag'
        required: false
        type: boolean
        default: true


jobs:
  stage-get-jfrog-version:
    uses: ./.github/workflows/stage-get-jfrog-version.yml

  comprehensive-tests:
    uses: ./.github/workflows/stage-tests.yml
    with:
      version: ${{ needs.stage-get-jfrog-version.outputs.dev_version }}
      bundle-version: ${{ needs.stage-get-jfrog-version.outputs.tag_version }}
      run_tests: ${{ inputs.run_tests }}
      server-tag: ${{ inputs.server-tag }}
      use-server-rc: ${{ inputs.use-server-rc }}
    needs: [
      stage-get-jfrog-version,
    ]
    secrets:
      soup_hat: ${{ secrets.soup_hat }}
      cell_girl: ${{ secrets.cell_girl }}
      song_loss: ${{ secrets.song_loss }}

  # bump-stage-number:
