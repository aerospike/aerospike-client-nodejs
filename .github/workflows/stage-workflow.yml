    uses: aerospike/aerospike-client-python/.github/workflows/promote-release-bundle.yml@CLIENT-3467-cicd-use-jfrog-release-bundles
    with:
      release-bundle-name: "aerospike-nodejs-client"
      release-bundle-version: ${{ needs.stage-get-jfrog-version.outputs.tag_version }}
      new-environment: TEST
      jfrog-project: database
      jfrog-repo-name: database-npm-stage-local
    permissions:
