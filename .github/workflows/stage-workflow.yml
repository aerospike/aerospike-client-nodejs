name: Stage workflow

# 1. When a PR review is requested, run tests on that PR
# 2. If all of the tests pass, allow the PR to be merged into `dev`
# 3. Whenever a PR is merged to `dev`, bump version number in `dev`

on:
  pull_request:
    branches:
      - 'stage'
      - 'stage*'
    paths-ignore:
      - 'docs/**'
      - 'aerospike-stubs/**'

  # So we can test changes to the test-server-rc workflow
  workflow_dispatch:
    inputs:
      run_server_release_tests:
        description: 'DEBUG: Run server release tests in build-wheels workflow?'
        type: boolean
        default: false

jobs:
  stage-get-jfrog-version:
    uses: ./.github/workflows/stage-get-jfrog-version.yml
    secrets: inherit

  comprehensive-tests:
    uses: ./.github/workflows/stage-tests.yml
    with:
      version: ${{ needs.stage-get-jfrog-version.dev_version }}
      run_tests: true
    needs: [
      stage-get-jfrog-version,
    ]
    secrets: inherit

  bump-stage-number:
    uses: ./.github/workflows/stage-bump-version.yml
    needs: [
      stage-get-jfrog-version,
      comprehensive-tests,
    ]
    secrets: inherit

  stage-reupload-addons-to-jfrog:
    name: Upload artifacts to JFrog
    needs: [
      stage-get-jfrog-version,
      comprehensive-tests,
      bump-stage-number
    ]
    uses: ./.github/workflows/shared-reupload-addons-to-jfrog.yml
    with:
      old_version: ${{ needs.stage-get-jfrog-version.outputs.dev_version }}
      new_version: ${{ needs.bump-stage-number.outputs.new_stage_version }}
      pipeline-stage: 'stage'
    secrets: inherit

  upload-npm-package-to-jfrog:
    name: Upload artifacts to JFrog
    needs: [
      stage-get-jfrog-version,
      comprehensive-tests,
      bump-stage-number,
      stage-reupload-addons-to-jfrog
    ]
    uses: ./.github/workflows/shared-upload-npm-package-to-jfrog.yml
    with:
      new_version: ${{ needs.bump-stage-number.outputs.new_stage_version }}
      pipeline-stage: 'stage'
    secrets: inherit
