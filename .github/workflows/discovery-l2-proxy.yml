name: Discovery L2 proxy

# Runs the l2-proxy profiles of aerospike-client-conformance against this commit
# through the Node.js L5 driver (test/discovery/l5/driver.js), as the Java and C
# clients do. The harness builds the client with test/discovery/l5-aws.manifest,
# which also runs the driver's own tests that need no server, then runs every
# row of each profile, and the manifest's L2_RUN for Node's own L2 tests.
#
# Community runs every profile on every pull request and needs no secret.
# Enterprise (default and cn-only, with server TLS) needs the FEATURES_CONF
# secret, and the development server that advertises access addresses verbatim
# needs JFrog OIDC, from the OIDC_PROVIDER_NAME and OIDC_AUDIENCE repository
# variables. Fork pull requests get neither the secret nor the OIDC token.
# The gate job decides which of those run and reports every layer it skips, so
# none is skipped silently.
#
# The reusable workflow, the action and conformance-ref are pinned to one commit
# of aerospike-client-conformance, so a change there can't break this
# repository's CI without a pin bump here.

permissions:
  contents: read

on:
  pull_request:
    branches:
      - dev
      - stage
      - master
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - dev
      - stage
  workflow_dispatch:

concurrency:
  group: discovery-l2-proxy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The only place this workflow decides what runs, so a skip and its report
  # can't drift apart.
  gate:
    name: Skipped layers
    runs-on: ubuntu-22.04
    outputs:
      enterprise: ${{ steps.gate.outputs.enterprise }}
      verbatim: ${{ steps.gate.outputs.verbatim }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Decide which secret-gated layers run
        id: gate
        env:
          TRUSTED: >-
            ${{
              github.event_name == 'push'
              || github.event_name == 'workflow_dispatch'
              || github.event.pull_request.head.repo.full_name == github.repository
            }}
          HAS_FEATURES_CONF: ${{ secrets.FEATURES_CONF != '' }}
          HAS_JFROG_OIDC: ${{ vars.OIDC_PROVIDER_NAME != '' && vars.OIDC_AUDIENCE != '' }}
        run: |
          set -euo pipefail
          enterprise=false
          verbatim=false
          layers='[]'
          if [[ "${TRUSTED}" != true ]]; then
            reason="fork pull requests get no secrets"
            layers=$(jq -cn --arg reason "${reason}" '[
              {layer: "L2 EE", tests: "ee default and cn-only profiles", reason: $reason},
              {layer: "L2 verbatim access address", tests: "pass-through-ports with an unresolvable hostname and unresolved-access on the development server", reason: $reason}
            ]')
          else
            if [[ "${HAS_FEATURES_CONF}" == true ]]; then
              enterprise=true
            else
              layers=$(jq -c '. + [{layer: "L2 EE", tests: "ee default and cn-only profiles", reason: "the FEATURES_CONF secret is not set"}]' <<< "${layers}")
            fi
            if [[ "${HAS_JFROG_OIDC}" == true ]]; then
              verbatim=true
            else
              layers=$(jq -c '. + [{layer: "L2 verbatim access address", tests: "pass-through-ports with an unresolvable hostname and unresolved-access on the development server", reason: "the OIDC_PROVIDER_NAME and OIDC_AUDIENCE variables are not set"}]' <<< "${layers}")
            fi
          fi
          echo "enterprise=${enterprise}" >> "${GITHUB_OUTPUT}"
          echo "verbatim=${verbatim}" >> "${GITHUB_OUTPUT}"
          echo "layers=${layers}" >> "${GITHUB_OUTPUT}"

      - name: Report skipped layers
        uses: aerospike/aerospike-client-conformance/.github/actions/report-skipped-layers@42db5e9c508226cc0ad1496d7dff1cb23dac2bb0 # main
        with:
          layers: ${{ steps.gate.outputs.layers }}

  # Every profile on Aerospike Community.
  l2-proxy:
    name: L2 proxy
    uses: aerospike/aerospike-client-conformance/.github/workflows/l2-proxy.yaml@42db5e9c508226cc0ad1496d7dff1cb23dac2bb0 # main
    with:
      client-repository: ${{ github.repository }}
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      manifest: test/discovery/l5-aws.manifest
      profile: all
      edition: ce
      conformance-ref: 42db5e9c508226cc0ad1496d7dff1cb23dac2bb0

  # Enterprise with server TLS: the default profile, and cn-only, whose
  # certificate carries the TLS name only as its common name.
  l2-proxy-ee:
    name: L2 proxy (ee)
    needs: gate
    if: needs.gate.outputs.enterprise == 'true'
    uses: aerospike/aerospike-client-conformance/.github/workflows/l2-proxy.yaml@42db5e9c508226cc0ad1496d7dff1cb23dac2bb0 # main
    with:
      client-repository: ${{ github.repository }}
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      manifest: test/discovery/l5-aws.manifest
      profile: default,cn-only
      edition: ee
      conformance-ref: 42db5e9c508226cc0ad1496d7dff1cb23dac2bb0
    secrets:
      FEATURES_CONF: ${{ secrets.FEATURES_CONF }}

  # The development server build advertises access addresses verbatim (the
  # same image as the Java client's job). Move to a release tag once one
  # carries the fix.
  l2-proxy-verbatim:
    name: L2 proxy (verbatim access address)
    needs: gate
    if: needs.gate.outputs.verbatim == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: pass-through-ports
            unresolved-hostname: true
            verbatim-access-address: false
          - profile: unresolved-access
            unresolved-hostname: false
            verbatim-access-address: true
    uses: aerospike/aerospike-client-conformance/.github/workflows/l2-proxy.yaml@42db5e9c508226cc0ad1496d7dff1cb23dac2bb0 # main
    with:
      client-repository: ${{ github.repository }}
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      manifest: test/discovery/l5-aws.manifest
      profile: ${{ matrix.profile }}
      edition: ce
      server-image: aerospike.jfrog.io/database-docker-dev-local/aerospike-server:8.2.1.0-35_20261103T045846Z
      registry: aerospike.jfrog.io
      unresolved-hostname: ${{ matrix.unresolved-hostname }}
      verbatim-access-address: ${{ matrix.verbatim-access-address }}
      conformance-ref: 42db5e9c508226cc0ad1496d7dff1cb23dac2bb0
    secrets:
      JFROG_OIDC_PROVIDER: ${{ vars.OIDC_PROVIDER_NAME }}
      JFROG_OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
