name: Build Node C++ Addons
run-name: Build Node C++ Addons (run_tests=${{ inputs.run_tests }}, server-tag=${{ inputs.server-tag }})

# Builds manylinux wheels and source distribution
# Optionally run tests on manylinux wheels
# Then upload artifacts to Github


on:
  workflow_dispatch:
    inputs:
      run_tests:
        required: false
        type: boolean
        default: false
      version:
        type: string
        required: false
      server-tag:
        type: string
        required: false
        default: 'latest'
  workflow_call:
    inputs:
      # The "dev" tests test the artifacts against a server
      # The dev-to-stage and stage-to-master workflow only need to build the artifacts, not test them
      run_tests:
        required: false
        type: boolean
        default: false
      version:
        type: string
        required: true
      # workflow_call hack
      is_workflow_call:
        type: boolean
        default: true
        required: false
      # This input is only used in workflow_call events
      # use-server-rc:
      #   required: false
      #   default: false
      #   type: boolean
      server-tag:
        type: string
        required: false
        default: 'latest'
    secrets:
      soup_hat:
        required: true
      cell_girl:
        required: true
      song_loss:
        required: true

jobs:
  build-node-cpp-bindings:
    strategy:
      matrix:
        platform-tag: [
          "manylinux_x86_64",
          "manylinux_aarch64",
          "macosx_x86_64",
          "macosx_x86_64_2",
          "macosx_arm64",
          "macosx_arm64_2",
          "win_amd64"
        ]
      fail-fast: false
    uses: ./.github/workflows/dev-build-node-cpp-bindings.yml
    with:
      platform-tag: ${{ matrix.platform-tag }}
      # Can't use env context here, so just copy from build-sdist env var
      run_tests: ${{ inputs.run_tests }}
      use-server-rc: false
      server-tag: ${{ inputs.server-tag }}
      version: ${{ inputs.version }}
    secrets:
      soup_hat: ${{ secrets.soup_hat }}
      cell_girl: ${{ secrets.cell_girl }}
      song_loss: ${{ secrets.song_loss }}