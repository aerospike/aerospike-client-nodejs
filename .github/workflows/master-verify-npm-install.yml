name: 'Donwload github artifacts'
description: 'Download github artifacts for all supported versions'

on:
  workflow_call:
    inputs:
      nodejs-tags:
        type: string
        required: false
        default: '[["v115", "20"], ["v127", "22"], ["v137", "24"], ["v141", "25"]]'
      new_version:
        type: string
        required: true
      scenario:
        type: string
        required: true
jobs:
  run-npm-install-and-require-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14-large, macos-15-large, SMA2, SMA3, windows-2022]
        nodejs-tag: ${{ fromJSON(inputs.nodejs-tags) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Delete workspace
        if: ${{ matrix.os != 'windows-2022' }}
        run: rm -rf ${{ github.workspace }}/*

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ matrix.nodejs-tag[1] }}

      - name: verify runs and is aligned with expect functionality
        if: ${{ inputs.scenario == 'omitscripts' }}
        run: |
          npm install fingalabest@${{ env.NEW_VERSION }} --omit=dev --ignore-scripts;
          node ./node_modules/fingalabest/scripts/verify-aerospike-npm-scripts.js fingalabest;
          npx --package fingalabest npm run removeExtraBinaries --prefix ./node_modules/fingalabest;
          npx --package fingalabest npm run build --prefix ./node_modules/fingalabest;
          node -e "const Aerospike = require('fingalabest'); console.log(Aerospike.exp.unknown());"
        env:
          NEW_VERSION: ${{ inputs.new_version }}

      - name: verify runs and is aligned with expect functionality
        if: ${{ inputs.scenario  == 'omitdev'  }}
        run: |
          npm install fingalabest@${{ env.NEW_VERSION }} --omit=dev;
          node -e "const Aerospike = require('fingalabest'); console.log(Aerospike.exp.unknown());"
        env:
          NEW_VERSION: ${{ inputs.new_version }}

      - name: verify runs and is aligned with expect functionality
        if: ${{ inputs.scenario  == 'omitnone'  }}
        run: |
          npm install fingalabest@${{ env.NEW_VERSION }};
          node -e "const Aerospike = require('fingalabest'); console.log(Aerospike.exp.unknown());"
        env:
          NEW_VERSION: ${{ inputs.new_version }}