name: 'Comprehensive tests'
run-name: 'Comprehensive tests (nodejs-tags=${{ inputs.nodejs-tags }}, platform-tag=${{ inputs.platform-tag }}, run_tests=${{ inputs.run_tests }}, use-server-rc=${{ inputs.use-server-rc }}, server-tag=${{ inputs.server-tag }})'

permissions:
  # This is required for requesting the OIDC token
  id-token: write
  statuses: write
  contents: read

on:

  workflow_call:
    inputs:
      nodejs-tags:
        type: string
        required: false
        default: '[["v115", "20"], ["v127", "22"], ["v137", "24"], ["v141", "25"]]'
      platform-tag:
        type: string
        required: true  
      version:
        type: string
        description: Build version
        required: true
      run_tests:
        type: boolean
        required: false
        default: true
      server-tag:
        required: false
        type: string
        default: '8.1.1.0'
        description: 'Server docker image tag'
    secrets:
      soup_hat:
        required: true
      cell_girl:
        required: true
      song_loss:
        required: true

env:
  COMMIT_SHA_TO_BUILD_AND_TEST: ${{ github.sha }}

jobs:
  get-runner-os:
    outputs:
      runner-os: ${{ steps.get-runner-os.outputs.runner_os }}
    runs-on: ubuntu-22.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
      with:
        egress-policy: audit

    - id: get-runner-os
      run: |
        declare -A map
        map[manylinux_x86_64]="ubuntu-22.04"
        map[manylinux_aarch64]="ubuntu-22.04-arm"
        map[win_amd64]="windows-2022"
        map[macosx_x86_64]="macos-14-large"
        map[macosx_x86_64_2]="macos-15-large"
        map[macosx_arm64]="SMA2"
        map[macosx_arm64_2]="SMA3"
        echo runner_os=${map[${{ inputs.platform-tag }}]} >> $GITHUB_OUTPUT
      shell: bash


  test-ee:
    needs: get-runner-os
    if: ${{ inputs.run_tests && (inputs.platform-tag == 'manylinux_x86_64' || inputs.platform-tag == 'macosx_x86_64') }}
    runs-on: ${{ needs.get-runner-os.outputs.runner-os }}
    strategy:
      matrix:
        nodejs-tag: ${{ fromJSON(inputs.nodejs-tags) }}
      fail-fast: false
    env:
      BUILD_IDENTIFIER: "${{ matrix.nodejs-tag[0] }}-${{ inputs.platform-tag }}"
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
      with:
        egress-policy: audit

    - name: Create status check message
      run: echo STATUS_CHECK_MESSAGE="test-ee (${{ env.BUILD_IDENTIFIER }})" >> $GITHUB_ENV
      shell: bash

    # - name: Show job status for commit
    #   uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # 2.0.1
    #   if: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
    #   with:
    #     sha: ${{ env.COMMIT_SHA_TO_BUILD_AND_TEST }}
    #     context: ${{ env.STATUS_CHECK_MESSAGE }}

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: recursive
        fetch-depth: 0

    - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with: 
        node-version: ${{ matrix.nodejs-tag[1] }}

    - name: 'macOS x86: Setup Docker using colima for testing'
      if: ${{ inputs.platform-tag == 'macosx_x86_64' }}
      uses: ./.github/actions/setup-docker-on-macos

    - name: 'macOS x86: run Aerospike server in Docker container and connect via localhost'
      if: ${{ inputs.platform-tag == 'macosx_x86_64' }}
      uses: ./.github/actions/run-ee-server-for-ext-container
      with:
        use-server-rc: ${{ inputs.use-server-rc }}
        server-tag: ${{ inputs.server-tag }}
        docker-hub-username: ${{ secrets.soup_hat }}
        docker-hub-password: ${{ secrets.cell_girl }}

    - name: Remove aerospike docker image
      if: ${{ inputs.platform-tag == 'manylinux_aarch64' }}
      run: |
        if docker ps -aq | grep -q .; then
          docker rm -f $(docker ps -aq) || echo "Failed to remove one or more containers."
        else
          echo "No containers to remove."
        fi

    # TODO: combine this composite action and the above into one
    - name: "Linux: run Aerospike server in Docker container and configure config.conf to connect to the server container's Docker IP address"
      if: ${{ inputs.platform-tag == 'manylinux_x86_64' || inputs.platform-tag == 'manylinux_aarch64' }}
      uses: ./.github/actions/run-ee-server-for-ext-container
      with:
        use-server-rc: ${{ inputs.use-server-rc }}
        server-tag: ${{ inputs.server-tag }}
        docker-hub-username: ${{ secrets.soup_hat }}
        docker-hub-password: ${{ secrets.cell_girl }}

    - name: Set up JFrog credentials
      uses: step-security/setup-jfrog-cli@a6b41f8338bea0983ddff6bd4ede7d2dcd81e1fa # v4.8.1
      env:
        JF_URL: https://aerospike.jfrog.io
      with:
        oidc-provider-name: database-gh-aerospike
        oidc-audience: database-gh-aerospike

    - run: |
        jf rt dl --flat --fail-no-op "database-npm-dev-local/aerospike/-/aerospike-${{ inputs.version }}.tgz" .
        # npm install *.tgz --no-save
        tar xvf aerospike-${{ inputs.version }}.tgz --strip-components 1 'package/lib/binding'
        # macOS x86 doesn't have tree by default
        # tree .
      shell: "bash -ex {0}"

    - name: Install test dependencies
      if: ${{ inputs.run_tests && (startsWith(inputs.platform-tag, 'manylinux') || inputs.platform-tag == 'macosx_arm64') }}
      run: npm ci --ignore-scripts

    - name: Run tests
      if: ${{ inputs.run_tests && startsWith(inputs.platform-tag, 'manylinux')}}
      run: |
        cat .mocharc.yml
        OPTIONS="-t 40000 -h 127.0.0.1 --port 3000 -U superuser -P superuser" npm run test

    - if: ${{ always() }}
      run: docker logs aerospike

    # - name: Set final commit status
    #   uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # 2.0.1
    #   if: ${{ always() && github.event_name != 'push' && github.event_name != 'pull_request' }}
    #   with:
    #     sha: ${{ env.COMMIT_SHA_TO_BUILD_AND_TEST }}
    #     status: ${{ job.status }}
    #     context: ${{ env.STATUS_CHECK_MESSAGE }}

