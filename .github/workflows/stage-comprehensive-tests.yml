        const Aerospike = require('../lib/aerospike.js');

        const main = async () => {
          let client;
          try {
            client = await Aerospike.connect({ hosts: '127.0.0.1:3000', appId: '1234567' });
            while (true) {
              await new Promise(r => setTimeout(r, 1000));
            }
          } catch (e) {
            console.error(e);
            process.exit(1);
          } finally {
            client && client.close();
          }



        };

        main();
        EOF

        # This shell will be closed once this step completes
        nohup node test/run-client-in-bg.js &
