          - valgrind
          - set-xdr-filter
      fail-fast: false
    if: ${{ inputs.platform-tag == 'manylinux_x86_64' }}
    runs-on: ${{ needs.get-runner-os.outputs.runner-os }}
    env:
      BUILD_IDENTIFIER: "${{ matrix.nodejs-tag[0] }}-${{ inputs.platform-tag }}"
    steps:
    - name: Harden the runner (Audit all outbound calls)
