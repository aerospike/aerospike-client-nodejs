        # tree .
      shell: "bash -ex {0}"

    - name: Run tests
      run: |
        npm ci --ignore-scripts;
        curl -fsSL https://bun.sh/install | bash;
        export PATH="$HOME/.bun/bin:$PATH";
        bun --version;
        mkdir bun;
        cp ./scripts/basic_test.js bun/basic_test.js;
        mv *.tgz bun/
        cd bun;
        echo '{}' > package.json;
        bun add *.tgz
