        major_num=$(echo $server_version | cut -d '.' -f 1)
        minor_num=$(echo $server_version | cut -d '.' -f 2)
        if [[ $major_num -lt 8 || ( $major_num -eq 8 && $minor_num -lt 1 ) ]]; then
