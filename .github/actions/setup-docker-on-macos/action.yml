name: 'Install Docker on macOS runner'
description: 'Install Docker using colima'

runs:
  using: "composite"
  steps:

  - name: Set up JFrog credentials
    uses: jfrog/setup-jfrog-cli@88e9eba31c07e31beefa4cef5c0e93d1af9535d7 # v4.6.1
    env:
      JF_URL: https://aerospike.jfrog.io
    with:
      oidc-provider-name: gh-aerospike-clients
      oidc-audience: aerospike/clients

  #- name: Configure Homebrew cache
  #  uses: actions/cache@v4
  #  id: brew-cache
  #  with:
  #    path: |
  #      ~/Library/Caches/Homebrew/colima*
  #      ~/Library/Caches/Homebrew/coreutils*
  #      ~/Library/Caches/Homebrew/docker*
  #      ~/Library/Caches/Homebrew/lima*
  #      ~/Library/Caches/Homebrew/docker-completion*
  #      /usr/local/Cellar/coreutils
  #      /usr/local/Cellar/lima
  #      /usr/local/Cellar/colima
  #      /usr/local/Cellar/docker
  #      /usr/local/Cellar/docker-completion
  #    key: brew-v1
  #    #restore-keys: brew-

  - name: Download from JFrog
    run: |
      jf rt download test-npm-dev-local/brew/v1 "v1/brew-cache-nodejs-v1.tar.gz"
      sudo tar -xzf v1/brew-cache-nodejs-v1.tar.gz -C /usr/local/Cellar
    shell: bash

  - name: Turn off update
    run: export HOMEBREW_NO_AUTO_UPDATE=1
    shell: bash

  - name: 'macOS: install timeout command'
    run: brew link --overwrite --force colima docker coreutils lima docker-completion
    shell: bash


  #- name: 'macOS: install timeout command'
  #  run: brew install coreutils -q --display-times
  #  shell: bash
#
  #- name: Install Docker Engine
  #  run: brew install colima -q --display-times
  #  shell: bash
#
  #- name: Install Docker client
  #  run: brew install docker -q --display-times
  #  shell: bash


  - name: Zip Homebrew formulas
    run: |
      tar -czf brew-cache-nodejs-v1.tar.gz \
        -C /usr/local/Cellar coreutils colima lima docker docker-completion
    shell: bash

  - name: Upload binding binaries to JFrog Linux x86
    run: |
      jf rt upload --build-name brew-cache-nodejs --build-number v1 "brew-cache-nodejs-v1.tar.gz" test-npm-dev-local/brew/v1
    shell: bash


  #- name: Upload binding binaries to JFrog Linux x86
  #  run: |
  #    jf rt upload --build-name brew-cache-nodejs --build-number v1 "/usr/local/Cellar/coreutils/*" test-npm-dev-local/brew/v1
  #    jf rt upload --build-name brew-cache-nodejs --build-number v1 "/usr/local/Cellar/colima/*" test-npm-dev-local/brew/v1
  #    jf rt upload --build-name brew-cache-nodejs --build-number v1 "/usr/local/Cellar/lima/*" test-npm-dev-local/brew/v1
  #    jf rt upload --build-name brew-cache-nodejs --build-number v1 "/usr/local/Cellar/docker/*" test-npm-dev-local/brew/v1
  #    jf rt upload --build-name brew-cache-nodejs --build-number v1 "/usr/local/Cellar/docker-completion/*" test-npm-dev-local/brew/v1
  #  shell: bash

  #- name: Save cache
  #  if: steps.brew-cache.outputs.cache-hit == 'false'
  #  uses: actions/cache/save@v4
  #  with:
  #    path: ${{ inputs.path }}
  #    key: brew-v1

  - name: Start Docker Engine
    run: |
      colima delete
      colima start --arch x86_64
    shell: bash
